# The whole stack. `docker compose up --build` and open http://localhost:8080
#
# Start order matters: the backend waits for Postgres to pass its healthcheck,
# because Hibernate fails hard on a database that isn't accepting connections yet.
# It does NOT wait for the ML service — by design. An incident must still be
# loggable when classification is unavailable, and starting without it is the
# cheapest way to keep proving that.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellidesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"          # published so you can psql into it locally
    volumes:
      - intellidesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellidesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build: ./ml-service
    # The image listens on "::" so Railway's IPv6-only private network can reach it.
    # Python's asyncio marks that socket IPv6-only (IPV6_V6ONLY), so on Docker's IPv4
    # bridge network the backend's connection to 172.x.x.x is refused — while the
    # healthcheck, which goes over ::1, still reports healthy. Locally, listen on IPv4.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    # AI drafting talks to Ollama running on your own machine (install it from
    # ollama.com, then `ollama pull qwen2.5:3b`). host.docker.internal reaches the
    # host from inside the container; extra_hosts makes that work on Linux too.
    # Without Ollama running, drafting answers 503 and everything else is unaffected.
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/intellidesk
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      ML_SERVICE_URL: http://ml:8000
      LLM_TIMEOUT_MS: "120000"
      SEED_DEMO_DATA: "true"
      # nginx puts the SPA and the API on one origin, so CORS should not come into
      # play. It is set anyway, including the app's own origin: if a proxy ever
      # rewrites the Host header the backend will classify same-origin requests as
      # cross-origin, and without this the first symptom is a login that fails with
      # an empty 403. Add your public URL here when deploying.
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8081:8080"          # direct access for debugging; the app uses nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  intellidesk-data:
