# Postgres only. Containerising the three services is a Milestone 2 job — there is no
# point writing Dockerfiles for an application whose shape is still moving.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellidesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - intellidesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  intellidesk-data:
