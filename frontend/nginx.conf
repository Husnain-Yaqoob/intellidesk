server {
    listen 80;
    server_name _;

    # Everything under /api goes to the Spring Boot service. No trailing slash on
    # proxy_pass, so the /api prefix is passed through unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # $http_host, not $host: $host strips the port, so the backend rebuilds its
        # own origin as http://localhost and decides that a request from
        # http://localhost:8080 is cross-origin. It then fails the CORS check and
        # returns an empty 403 — which looks exactly like a broken login.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend waits up to 2s on the ML service, so allow a little headroom.
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # React Router owns the URLs. Anything that isn't a real file is handed to
        # index.html, otherwise a refresh on /incidents/141 returns a 404.
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard.
    location /assets/ {
        root      /usr/share/nginx/html;
        expires   1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
