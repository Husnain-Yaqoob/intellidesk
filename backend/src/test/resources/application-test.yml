spring:
  datasource:
    url: jdbc:h2:mem:intellidesk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

intellidesk:
  seed:
    enabled: false
  ml:
    # Tests must not depend on a running Python service.
    enabled: false
